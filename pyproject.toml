[project]
name = "craftmcp"
version = "0.1.0"
description = "Minecraft development MCP tools"
requires-python = ">=3.11,<3.14"
dependencies = ["fastmcp==2.14.5"]

[project.scripts]
craftmcp-debugger = "mcp_server.debugger_app:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
