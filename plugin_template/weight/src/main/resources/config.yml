# Speed = max(min-speed-multiplier, base-speed-multiplier - total-weight * speed-loss-per-weight).
base-speed-multiplier: 1.25
speed-loss-per-weight: 0.025
min-speed-multiplier: 0.35
count-offhand: false
update-period-ticks: 5

